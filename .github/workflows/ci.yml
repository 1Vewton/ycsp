name: CI

# 每次 push / PR 都检查三层能否装依赖、过格式检查、编译或构建。
# CI 环境没有 .env，因此各层都走代码里的默认值（见各层 README 的配置说明）。
# action 版本固定到具体 release：浮动大版本 tag 并非都存在（例如 setup-uv 只发布了 v10.3.0）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支来了新提交时，取消仍在跑的旧任务，省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute:
    name: compute (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Import check
        run: uv run python -c "import app.main"

      - name: Test with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -cover ./...

  frontend:
    name: frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
