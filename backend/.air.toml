root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "bin"]
exclude_regex = ["_test.go"]
delay = 500
# Docker Desktop 的 bind mount 不保证发出 fsnotify 事件，轮询更稳。
poll = true
poll_interval = 500
stop_on_error = true

[misc]
clean_on_exit = true
