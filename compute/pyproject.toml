[project]
name = "ycsp-compute"
version = "0.1.0"
description = "数据处理层：按化学组成预测晶体结构的计算服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
# 本项目是应用而非库，只同步依赖，不需要把自身打包安装。
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# 让测试能直接 import app.*（从 compute/ 根目录运行）。
pythonpath = ["."]
testpaths = ["tests"]
